# coturn for local development: browsers and coturn on the same machine.
# The production config (public IP, TLS, wider relay range).
# The shared secret is passed on the command line from TURN_SECRET, never stored here.

listening-port=3478
listening-ip=127.0.0.1
relay-ip=127.0.0.1
# Every allocation holds one port until it is freed or expires (10 min). Browsers closed by a
# test do not free theirs, and one E2E run makes ~100, so the range is wider than 41 ports.
min-port=49160
max-port=49999
realm=ts-rtc.local

# Time-limited HMAC credentials minted by the server (TURN REST API scheme).
use-auth-secret
fingerprint
stale-nonce=600

# Bounds: allocations per user and in total, bytes per second per session.
user-quota=10
total-quota=300
max-bps=500000

no-cli
no-tls
no-dtls
no-multicast-peers
no-software-attribute
log-file=stdout

# Never relay into private or special networks (SSRF through TURN).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# DEV ONLY: both browsers run here, so (relay-relay) traffic stays on loopback.
allow-loopback-peers
allowed-peer-ip=127.0.0.1